[project]
name = "omnimcp-backend"
version = "0.1.0"
description = "OmniMCP unified distributed AI agent development and execution platform - Control Plane"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "mcp>=1.12,<2",
    "prometheus-client>=0.20",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.4", "aiosqlite>=0.20"]

[project.scripts]
omnimcp-server = "omnimcp.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omnimcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

