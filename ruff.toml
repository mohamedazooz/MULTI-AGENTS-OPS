line-length = 110
target-version = "py312"

[lint]
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "RUF",
]
ignore = [
    "B008",  # FastAPI Depends() in defaults
    "B904",  # raise-from inside except desired style differs
    "UP042",  # (str, Enum) intentional: API JSON uses .value, keep pydantic-compatible
    "E501",  # line-length handled pragmatically
]

[lint.per-file-ignores]
"backend/tests/*" = ["B011", "RUF059"]
"worker/tests/*" = ["RUF059"]
